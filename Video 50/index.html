<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Filters</title>
    <style>
        .container {
            display: flex;
        }

        img {
            width: 580px;
            height: 480px;
            object-fit: cover;

            /* blur for the you want to make your image blurry and you can abjust the value to make it more or less blurry */
            /* filter: blur(10px); */
        }

        .img1{
            /* brightness for the you want to make your image bright and contrast fot the you want to make your image more contrasty or less contrasty */
            filter: brightness(150%) contrast(0.5);
        }

        .img2{
            /* black and white image */
            filter: grayscale(100%);
        }

        .img3{
            /* yellowish image */
            filter: sepia(100%);
        }
    </style>
</head>

<body>
    <div class="container">
        <img class="img1" src="https://www.mcgill.ca/web-services/files/web-services/styles/hd/public/marco-xu-toupbco62lw-unsplash_cropped.jpg?itok=vnN8-uiS&timestamp=1708957693"
            alt="Image">
        <img class="img2" src="https://wallpapers.ipl.com/files/preview/960x1706/465931765329436njbjdommo4fuwtlfy25fuvtomz3p4kjewzmmctvptldywn4yafsbip9jhyd4q2y8sxbt8nkolnx1mf9lbgkqci5jcjszrnsbbvkp.jpg"
            alt="">
        <img class="img3" src="https://thefederal.com/h-upload/2025/04/06/525127-jasprit-bumrah-mi-nets.webp" alt="">
    </div>

</body>

</html>
