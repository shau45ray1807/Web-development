        /* Element ko CSS ke through dynamaticaly insert kiya ja sakta hai  */
        .boxes::before {
            content: "Hey, i'm also a box. Using before selector.";
            color: blue;
        }

        .boxes::after{
            content: "Hey, I'm also a box. Using after selector.";
            color: red;
        }

        /* selectrion means select karne par  */
        ::selection{
            background-color: aqua;
            color: red;
        }

        .box::first-letter{
            color: peru;
            font-size: 45px;
        }

        input::placeholder{
            color: rgb(160, 170, 177);
        }
    </style>
</head>

<body>
    <div class="boxes">
        <div data-color="primary" class="box">Hey, I'm a first box</div>
        <div class="box">Hey, I'm a box</div>
        <div class="box">Hey, I'm a box</div>
        <input type="text" placeholder="Type your name here">
    </div>
