<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6 - Navbar Using Flexbox</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0;
            padding: 0;
        }

        body {
            box-sizing: border-box;
            font-family: "Manrope", sans-serif;
        }

        header {
            position: sticky;
            top: 0;
            border-bottom: 1px solid white;
            background-color: white;
        }

        .promo {
            background-color: #ffd741;
            text-align: center;
            padding: 10px;
            font-weight: 500;
            font-size: 18px;
        }

        .promo a {
            color: black;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #cfccccb3;
            border-radius: 4px;
            background-color: #f1efef8f;
            margin: 10px 105px;
            max-height: 75px;
        }

        .logo img {
            width: 100%;
            max-width: 150px;
            margin: 0px 16px;
            margin-top: 5px;
            cursor: pointer;
        }

        .item ul {
            list-style: none;
            display: flex;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
        }

        .item ul li {
            display: flex;
            align-items: center;
            padding: 10px;
        }

        .item ul li svg {
            padding: 4px;
        }

        .hover:hover {
            border-radius: 6px;
            background-color: #cfccccb3;
            cursor: pointer;
        }

        .right {
            display: flex;
            justify-content: flex-end;
        }

        .download {
            font-size: 100%;
            margin: 21px;
            padding: 10px 23px;
            border-radius: 4px;
            text-align: center;
            background-color: #ffd741;
            border: 0px solid #ffd741;
        }

        .download:hover {
            background-color: rgb(254, 226, 85);
            cursor: pointer;
            border-radius: 6px;
        }

        .language {
            display: flex;
            align-items: center;
            font-size: 100%;
            margin: 20px;
            padding: 0 10px;
            border-radius: 6px;
            text-align: center;
            background-color: #00000000;
            border: 0;
        }

        .language svg {
            padding: 5px;
        }

        .language:hover {
            border-radius: 6px;
            background-color: #cfccccb3;
            cursor: pointer;
        }

        .search {
            margin: 20px;
            background-color: #00000000;
            border: 0;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>

        <div class="promo">
            <p>UE Core & Enterprise Subscriptions: Get <strong>10% Off</strong> on your second year <a href="#"><b>Buy
                        Now</b>→</a>
            </p>
        </div>

        <div class="navbar">
            <div class="logo">
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo-1.png" alt="">
            </div>

            <div class="item">
                <nav>
                    <ul>
                        <li class="hover">Products <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                width="18" height="18" color="currentColor" fill="none" stroke="#141B34"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                            </svg></li>
                        <li>Buy</li>
                        <li>Renew</li>
                        <li class="hover">Support <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18"
                                height="18" color="currentColor" fill="none" stroke="#141B34" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                            </svg></li>
                        <li class="hover">Learn <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18"
                                height="18" color="currentColor" fill="none" stroke="#141B34" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                            </svg></li>
                        <li class="hover">Company <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18"
                                height="18" color="currentColor" fill="none" stroke="#141B34" stroke-width="1.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                            </svg></li>
                    </ul>
                </nav>
            </div>

            <div class="right">
                <button class="download">Download</button>
                <button class="language"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18"
                        height="18" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linejoin="round">
                        <path
                            d="M12 22C6.47715 22 2 17.5228 2 12C2 9.20746 3.14465 6.68227 4.99037 4.86802M12 22C11.037 21.2864 11.1907 20.4555 11.6738 19.6247C12.4166 18.3474 12.4166 18.3474 12.4166 16.6444C12.4166 14.9414 13.4286 14.1429 17 14.8571C18.6047 15.1781 19.7741 12.9609 21.8573 13.693M12 22C16.9458 22 21.053 18.4096 21.8573 13.693M21.8573 13.693C21.9511 13.1427 22 12.5771 22 12C22 7.11857 18.5024 3.05405 13.8766 2.17579M13.8766 2.17579C14.3872 3.11599 14.1816 4.23551 13.1027 4.66298C11.3429 5.3603 12.6029 6.64343 11.1035 7.4356C10.1038 7.96372 8.6044 7.83152 7.10496 6.24716C6.31517 5.41264 5.83966 4.95765 4.99037 4.86802M13.8766 2.17579C13.2687 2.06039 12.6414 2 12 2C9.26969 2 6.79495 3.09421 4.99037 4.86802" />
                    </svg> English</button>
                <button class="search">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18"
                        color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M17 17L21 21" />
                        <path
                            d="M19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19C15.4183 19 19 15.4183 19 11Z" />
                    </svg>
                </button>
            </div>
        </div>
    </header>
</body>

</html>
