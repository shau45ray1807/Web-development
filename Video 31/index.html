<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Media Query</title>
    <style>
        body {
            background-color: aqua;
        }

        /* @media only/not mediatype and (expressions) {
            CSS Code. 
        } */
        @media screen and (orientation: landscape) {
            body {
                border: 2px solid blue;

            }
        }

        @media only screen and (max-width: 845px) {
            body {
                background-color: aquamarine;
            }

            .boxes {
                flex-direction: column;
            }
        }

        .boxes {
            display: flex;
        }

        .box {
            background-color: beige;
            padding: 3px;
            margin: 3px;
            height: 344px;
            width: 344px;
        }
    </style>
</head>

<body>
    <div>
        Hey, i'm a aqua body guy!
    </div>

    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

</body>

</html>
