<!-- Ek registration form banao jisme — naam (text), email, password, gender (radio buttons), favourite language (checkbox: HTML, CSS, JS), city (dropdown select), aur ek message textarea ho. Sab inputs pe proper label aur placeholder lagao. Required fields bhi mark karo. -->

<!-- Topics covered: Forms, Input types (text, email, password, radio, checkbox), Select, Textarea, Label, required, placeholder -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body>
    <h1>Registration Form for Web Development</h1>
    <p>Note:- All fields are required and mandatory so please fill all the fields correctly.</p>
    <form action="#" method="post">
        <div>
            <label for="name">Enter your name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>
        <div>
            <label for="email">Enter your email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div>
            <label for="password">Enter your password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <div>
            <label for="radio">Select your gender</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
        </div>
        <div>
            <label for="checkbox">Select Your Favourite Languages</label>
            <input type="checkbox" id="html" name="language" value="html">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="language" value="css">
            <label for="css">CSS</label>
            <input type="checkbox" id="javascript" name="language" value="JavaScript">
            <label for="javascript">JavaScript</label>
        </div>
        <div>
            <label for="city">Select you City</label>
            <select name="city" id="city" required>
                <option value="">Select</option>
                <option value="imamganj">Imamganj</option>
                <option value="gaya">Gaya</option>
                <option value="patna">Patna</option>
                <option value="aurangabad">Aurangabad</option>
                <option value="sherghati">Sherghati</option>
            </select>
        </div>
        <div>
            <label for="message">Enter your comment</label>
            <textarea name="message" id="message" placeholder="Enter your comment" required></textarea>
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>

</html>
