<!-- Favourite Websites ki Link Page -->

<!-- Ek page banao jisme 4–5 tumhari favourite websites ki links hon. Har link ke saath ek image (logo ya koi bhi image) bhi ho. Kuch links same tab mein aur kuch naye tab mein khulne chahiye. -->

<!-- Topics covered: Links (anchor tag), Images (img tag), target="_blank", alt attribute -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favourite Websites</title>
</head>

<body>
    <h1>My Favourite Websites</h1>

    <a href="https://www.google.com" target="_blank">
        <img src="google.png" alt="Google Logo">
        Google</a>

    <a href="https://www.youtube.com" target="_blank">
        <img src="youtube.png" alt="Youtube Logo">
        Youtube</a>

    <a href="https://www.instagram.com" target="_blank">
        <img src="instagram.png" alt="Instagram Logo">
        Instagram</a>

    <a href="https://www.facebook.com">
        <img src="facebook.png" alt="Facebook Logo">
        Facebook</a>

    <a href="https://www.twitter.com">
        <img src="twitter.png" alt="Twitter Logo">
        Twitter</a>

</body>

</html>
