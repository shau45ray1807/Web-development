<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Selectors Masterclass</title>
    <style>

        /* Element Selector  */
        div{
            /* background-color: red; */
        }

        /* Class Selector  */
        .red{
            background-color: red;
        }

        /* Id Selector  */
        #green{
            background-color: green;
        }

        /* Child Selector  */
        div > p{
            color:red ;
            background-color: aqua;
        }

        /* Descendent Selector  */
        div p{
            color: red ;
            background-color: aqua;
        }

        /* Universal Selector  */
        *{
            margin: 0;
            padding: 0;
        }

        /* Pseudo Selector  */
        a:visited{
            color: yellow;
        }

        a:link{
            color: aquamarine;
        }

        a:active{
            background-color: black;
        }

        a:hover{
            background-color: yellowgreen;
        }

        p:first-child{
            background-color: aqua;
        }

    </style>
</head>

<body>
    <main class="one">
        <p>I am first.</p>
        <p>I am second.</p>
    </main>

    <div class="red">
        I am a div.
    </div>

    <div id="green">
        I am another div.
        <article>
            <p>Hey, I'm a paragraph. Inside div</p>
        </article>
    </div>
    <a href="https://www.google.com">Go to Google</a>
    <a href="https://www.youtube.com">Go to YouTube</a>

</body>

</html>
