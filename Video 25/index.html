<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Style lists</title>
    <style>
        nav>ul>li {
            list-style: devanagari;
            list-style-type: "🏚️";
            background-color: aquamarine;
            /* Always : :marker outside the list element in Lists, So use list-style-posotion to do handel your marker  */
            /* list-style-position: inside; */
            border: 2px solid red;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>

</body>

</html>
