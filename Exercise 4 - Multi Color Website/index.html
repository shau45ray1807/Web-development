<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise - 4 - Multi Color Website</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <style>
        :root {
            --primary-color: #ab5afacc;
            --text-color: white;
            --secondary-color: #e3d0f5cc;
        }
        /* :root {
            --primary-color: #082dfc;
            --text-color: #67040f;
            --secondary-color: #63aee6;
        } */

        body {
            background-color: var(--secondary-color);
        }

        * {
            padding: 0;
            margin: 0;
            font-family: "Poppins", sans-serif;
        }

        nav {
            background-color: var(--primary-color);
            padding: 20px 0;
        }

        ul li {
            list-style: none;
            display: inline;
            padding: 20px;
            font-weight: bolder;
        }

        ul li a {
            color: var(--text-color);
            text-decoration: none;

        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Contact Us</a></li>
            </ul>
        </nav>
    </header>

</body>

</html>
