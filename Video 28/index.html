<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Position Property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 350px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }

        .box1 {
            /* Position sticky it means yeh website ke ribbon bar se ja kar chipak jay ga and your page ka sara content iske behind scroll hoga */
            /* position: sticky;
            top: 0px;
            height: 111px;
            width: 100%;
            margin: 0;
            padding: 0; */
            background-color: aqua;

            /* Position absolute karne ke baad Top ek dam top se start hota hai and left lagane se ekdam left se start hota hai and bottom se toh satrt bottom se and right se toh satrt right se. 
            and agar parent hai toh apne parent ke mutabik chalega.
            Position absolute yeh apne nearest parent dhundhati hai jo ki positioned(absolute) hai, and uske mutabik hi apna position change karti hai.  */
            position: absolute;

            /* Jis element ki z-index value jitna zayda hoga wo element utna hi uppar aayega and agar kam hoga toh woh utna hi niche hoga */
            z-index: 1;
            top: 10px;
            left: 15px;

        }

        .box2 {
            background-color: aquamarine;
            /* position: relative; */
            /* top: -68px; */
            /* left: 115px; */
        }

        .box3 {
            background-color: red;

            /* Position fixed it means fixed even you page scroll but you positioned(fixed) not scroll  */
            /* position: fixed;
            bottom: 0px;
            left: 8vw;
            width: 80vw;
            height: 145px; */
        }

        .box4 {
            background-color: blue;
            /* position: relative; */
        }

        .parent {
            padding: 43px;
            margin: 34px;
            border: 3px solid red;
            position: absolute;
            
            /* Exception: Transform, filter, or perspective properties can also make an element appear as positioned */
            /* This three are also a make an element as a positioned  */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
