<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS - Animations</title>
    <style>
        .container {
            background-color: aqua;
            height: 80vh;
            width: 30vw;
        }

        .box {
            width: 30px;
            height: 45px;
            /* background-color: red; */

            /* your animation name it means @keyframes name  */
            /* animation-name: ShauraysAnimation; */

            /* animation duration means kitna time ya der tak chalega  */
            /* animation-duration: 1s; */

            /* animation-iteration-count means jo animation aap lagaye ho wo kitna baar chale ga ya wo kitna baar repeat karega */
            /* animation-iteration-count: infinite; */

            /* animation-timing-function means jo animation aap ne banaye hai wo uska function kaisa hoga chale ga kaisa and ise apne website ke page me inscept ksrke easily timing funtion graph ke help se easily new and apna animation-timing-function bana sakte hai  */
            /* animation-timing-function: cubic-bezier(0.4, 0, 0.08, 1.44); */

            /* animation-delay means jo animation aap  banaye hai wo kitna time baad start hoga start hone me kitna time loge jo animation aap banaye hai  */
            /* animation-delay: 1s; */

            /* animation-direction means wo jo animation aap ne baya hai uska direction kaya ho wo chalega kaise  */
            /* animation-direction: reverse; means jo aap ne animation diya hai kisi box ko toh wah reverse yani ulta chalrga, agar aapne diya ho left toh wah right me chalega agr right to left simple meaningn reverse ya ulata chalge aapka animation  */
            /* animation-direction: reverse; */

            /* animation-direction: alternate-reverse; means aapka nimation apne position se animate hokar waaps apne position pas aajayega */
            /* animation-direction: alternate-reverse; */

            /* animation-play-state means aapka animation ka state kaisa ho ruka rahe ya  chlta rahe etc kaisa ho */
            /* aniamtion-play-state: paused; means aap apne animation ko jaha paused karenge wo wahi paused ho jayega and jab aap dobaara agar unpaused karenge toh wo animation jaha paused hutha wahi se dobaara chalega naki shuru se ok */
            /* animation-play-state: paused; */

            /* animation-fill-mode means aapka niamtion forwards hoga ya backwards and etc */
            /* animation-fill-mode: forwards; */

            /* Whenever you want to use all property in one element it means in one line so use like this And agar aap kisis property ko use nahi karna chate hai toh ushe khali chor de ya phir nalikhe ok */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            /* animation: ShauraysAnimation 3s  ease-in-out 3s 1 backwards; */

            /* Agar aap apne box ya jise bhi aap more than one animation dena chahate hai toh aap aise de sakate hai */
            animation: ShauraysAnimation 2s ease-in-out 3s 1,
                Shauray2 3s ease-in-out 3s 1;

        }

        @keyframes ShauraysAnimation {
            from {
                background-color: red;
            }

            to {
                background-color: rgb(248, 203, 203);
                transform: translateX(1000px);
            }
        }

        @keyframes Shauray2 {
            0% {
                transform: rotate(100deg);
            }

            20% {
                transform: rotate(200deg);
            }

            50% {
                transform: rotate(220deg);
            }

            80% {
                transform: rotate(300deg);
            }

            100% {
                transform: rotate(310deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>

</body>

</html>
